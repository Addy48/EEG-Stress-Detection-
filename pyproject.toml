[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-stress"
version = "1.0.0"
description = "Subject-dependent vs subject-independent stress classification on SAM40 EEG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost", "catboost"]

[project.scripts]
eeg-stress = "eeg_stress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
